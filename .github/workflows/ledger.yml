name: Ledger CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ledger:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm ci --ignore-scripts
      - name: Upstream files are unmodified
        run: node tools/checks/upstream-unchanged.mjs
      - name: Unit tests (upstream + ledger)
        run: npx vitest run src
        env:
          CI: true
      - name: Build and integration tests
        run: npm run build
        env:
          CI: true
      - name: CLI contract
        run: npx vitest run test-lib/ledger-cli.test.js test-lib/ledger-lib.test.js
        env:
          CI: true
      - name: Benchmark (smoke, 120 documents)
        run: node tools/bench/run.mjs node_modules --limit 120

  # The build toolchain (vitest 4, cpy-cli, yargs-parser) requires Node 20+, while the
  # published library declares node >= 18. Build with 22, then switch the runtime to 18
  # and exercise the built artifacts. This is the only honest way to check that floor.
  runtime-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build with the toolchain that supports it
        run: npm run build
        env:
          CI: true
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Runtime smoke on node 18
        run: node --version && node tools/checks/runtime-smoke.mjs
